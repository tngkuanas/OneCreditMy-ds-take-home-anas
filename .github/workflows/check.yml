name: Check submission
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyrefly check
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python -m company_summaries.evaluate --version v1
      - run: uv run python -m company_summaries.evaluate --version v2
      - run: uv run python -m company_summaries.evaluate --version v3 --require-complete
      - run: uv run python -m company_summaries.evaluate --version rules-only --require-complete
      - run: uv run python -m company_summaries.evaluate --version v4 --require-complete
      - run: uv run python -m company_summaries.evaluate --version v4-rules --require-complete
      - run: uv run python -m company_summaries.experiments
      - run: uv run python -m company_summaries.report
      - run: git diff --exit-code -- summaries evaluations
